name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: build-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7 with Retry
        run: |
          if ! command -v gradle >/dev/null 2>&1 || ! gradle --version | grep -q "8.7"; then
            curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip \
              || curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
            sudo unzip -q -d /opt /tmp/gradle-8.7-bin.zip
            echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          fi

      - name: Run Web, Worker & Android Regression Evals
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Signed Release or Debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            export KEYSTORE_FILE="release-keystore.jks"
            export KEY_ALIAS="${KEY_ALIAS:-upload}"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            GRADLE_TASK="testDebugUnitTest assembleRelease"
          elif [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            export KEYSTORE_FILE="release-keystore.jks"
            export KEYSTORE_PASSWORD="android"
            export KEY_ALIAS="androiddebugkey"
            export KEY_PASSWORD="android"
            GRADLE_TASK="testDebugUnitTest assembleRelease"
          else
            GRADLE_TASK="testDebugUnitTest assembleDebug"
          fi
          for attempt in 1 2 3; do
            gradle $GRADLE_TASK --no-daemon && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Gradle build hit transient network/rate-limit error (attempt $attempt); retrying in 10s..."
            sleep 10
          done
          mkdir -p dist
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk dist/TVTimeTracker.apk
          elif ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk dist/TVTimeTracker.apk
          fi
          cp dist/TVTimeTracker.apk dist/TVTimeTracker-firebase.apk || true
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f dist/TVTimeTracker.apk ]; then
            zip -j -P "$KEYSTORE_PASSWORD" dist/TVTimeTracker-Protected.zip dist/TVTimeTracker.apk
            rm -f dist/TVTimeTracker.apk
          fi

      - name: Upload APK to Firebase App Distribution
        if: ${{ env.FIREBASE_ANDROID_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: family
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: android/dist/TVTimeTracker-firebase.apk
          releaseNotes: "TVTimeTracker build #${{ github.run_number }} (${{ github.event.head_commit.message }})"

      - name: Clean temporary Firebase APK before artifact upload
        if: always()
        run: rm -f android/dist/TVTimeTracker-firebase.apk

      - name: Upload TVTimeTracker Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVTimeTracker-Android-APK
          path: android/dist/*

